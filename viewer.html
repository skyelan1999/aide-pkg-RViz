<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RViz Workbench</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111a26;
        --panel: #182434;
        --line: #304154;
        --text: #dce6f2;
        --muted: #8da1b7;
        --accent: #79b6db;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        background: #203044;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 9px;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      input:focus,
      button:focus-visible,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      header {
        height: 57px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        letter-spacing: 0.04em;
      }
      header small {
        color: var(--muted);
        flex: 1;
      }
      main {
        display: grid;
        grid-template-columns: 266px 1fr 220px;
        height: calc(100% - 57px);
        min-height: 450px;
      }
      aside {
        background: var(--panel);
        padding: 15px;
        overflow: auto;
      }
      aside:first-child {
        border-right: 1px solid var(--line);
      }
      aside:last-child {
        border-left: 1px solid var(--line);
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 5px 0 12px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin: 10px 0 4px;
      }
      input,
      select {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .row > * {
        flex: 1;
      }
      .check {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .check input {
        width: auto;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .canvas {
        position: relative;
        min-width: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #233448, #111a26 70%);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        pointer-events: none;
        left: 18px;
        top: 16px;
        color: #94a9bf;
        font-size: 11px;
      }
      .notice {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 42px;
        font-size: 11px;
        color: #a8c2d4;
        pointer-events: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .legend {
        position: absolute;
        bottom: 17px;
        left: 18px;
        color: #91a5bb;
        font-size: 11px;
      }
      .layer {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .layer button {
        float: right;
        padding: 0 6px;
      }
      .layer b {
        font-size: 12px;
      }
      .error {
        color: #f2b090;
      }
      .ok {
        color: #8eceb2;
      }
      #status {
        padding: 12px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #frames {
        max-height: 220px;
        overflow: auto;
        font:
          11px/1.8 ui-monospace,
          monospace;
      }
      #image {
        max-width: 100%;
        max-height: 200px;
      }
      #filelist {
        max-height: 140px;
        overflow: auto;
      }
      .file {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
        padding: 4px;
      }
      .badge {
        font-size: 10px;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 8px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 235px 1fr;
        }
        aside:last-child {
          display: none;
        }
      }
      @media (max-width: 560px) {
        main {
          grid-template-columns: 180px 1fr;
        }
        aside {
          padding: 9px;
        }
        header {
          gap: 8px;
          padding: 0 10px;
        }
        header small {
          display: none;
        }
        .row {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>RViz Workbench</strong><span class="badge">PREVIEW · 0.1.0</span
      ><small data-i18n="subtitle">项目、坐标与实时话题</small
      ><button id="language" title="Language / 语言">EN</button
      ><button id="home" data-i18n="reset">重置视角</button>
    </header>
    <main>
      <aside>
        <h2 data-i18n="connection">连接</h2>
        <label for="mode" data-i18n="mode">接入方式</label
        ><select id="mode">
          <option value="direct">ROS bridge</option>
          <option value="ssh">SSH → remote bridge</option></select
        ><label for="ros">ROS</label
        ><select id="ros">
          <option value="2">ROS 2</option>
          <option value="1">ROS 1</option></select
        ><label for="endpoint" id="endpointLabel">WebSocket URL</label
        ><input id="endpoint" value="ws://127.0.0.1:9090" spellcheck="false" />
        <div id="sshFields" hidden>
          <label for="alias">OpenSSH config alias</label
          ><input id="alias" placeholder="robot-lab" /><label for="port"
            >Remote loopback port</label
          ><input id="port" type="number" value="9090" min="1" max="65535" />
        </div>
        <label class="check"
          ><input id="qos" type="checkbox" /><span data-i18n="qos"
            >bridge 支持显式 QoS（2.1）</span
          ></label
        >
        <div class="row">
          <button id="connect" data-i18n="connect">连接</button
          ><button id="disconnect" data-i18n="disconnect" disabled>断开</button>
        </div>
        <p class="hint" data-i18n="networkHint">
          连接由 Aide 后端发起。SSH 使用后端已有密钥与 known_hosts，不接受密码。
        </p>
        <hr />
        <h2 data-i18n="displays">显示</h2>
        <label for="fixed">Fixed frame</label
        ><input id="fixed" value="map" /><label for="topics" data-i18n="topic"
          >话题</label
        ><select id="topics">
          <option value="">—</option>
        </select>
        <div class="row">
          <button id="refresh" data-i18n="refresh">刷新话题</button
          ><button id="add" data-i18n="add">添加</button>
        </div>
        <div id="layers"></div>
        <div class="row">
          <button id="save" data-i18n="save">保存配置</button
          ><button id="demo" data-i18n="demo">演示场景</button>
        </div>
        <hr />
        <h2 data-i18n="project">项目资源</h2>
        <select id="sources"></select
        ><label for="directory" data-i18n="directory">项目相对目录</label
        ><input id="directory" value="." />
        <div class="row">
          <button id="browse" data-i18n="browse">浏览</button
          ><button id="parent" data-i18n="parent">上一级</button>
        </div>
        <div id="filelist"></div>
        <label for="file">URDF / display config path</label
        ><input id="file" placeholder="urdf/robot.urdf" /><button
          id="load"
          class="file"
          data-i18n="load"
        >
          加载项目文件</button
        ><label for="packages" data-i18n="packages"
          >package 映射（JSON，相对项目根）</label
        ><input id="packages" value="{}" />
      </aside>
      <section class="canvas" id="viewport">
        <div class="overlay">
          ROS · Z UP<br /><span id="sceneInfo">Grid / Axes</span>
        </div>
        <div class="notice" id="notice" role="status"></div>
        <div class="legend" data-i18n="controls">
          拖动旋转 · 滚轮缩放 · 右键平移
        </div>
      </section>
      <aside>
        <h2 data-i18n="diagnostics">诊断</h2>
        <div id="status" data-i18n="initial">未连接</div>
        <h2>TF</h2>
        <div id="frames">—</div>
        <hr />
        <h2 data-i18n="previewBudget">预览预算</h2>
        <p class="hint" data-i18n="budget">
          有界轮询，点云/激光最多 3,000 点、地图最多 16,384
          格/层。抽稀和坐标错误会明确标注。未连接真实机器人。
        </p>
        <img id="image" hidden alt="ROS image preview" />
      </aside>
    </main>
