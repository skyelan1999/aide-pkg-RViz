<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RViz Workbench</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111a26;
        --panel: #182434;
        --line: #304154;
        --text: #dce6f2;
        --muted: #8da1b7;
        --accent: #79b6db;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.5 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        background: #203044;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 7px 9px;
        min-width: 0;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      input:focus,
      button:focus-visible,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      header {
        height: 57px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      header strong {
        letter-spacing: 0.04em;
      }
      header small {
        color: var(--muted);
        flex: 1;
      }
      main {
        display: grid;
        grid-template-columns: 266px 1fr 220px;
        height: calc(100% - 57px);
        min-height: 450px;
      }
      aside {
        background: var(--panel);
        padding: 15px;
        overflow: auto;
      }
      aside:first-child {
        border-right: 1px solid var(--line);
      }
      aside:last-child {
        border-left: 1px solid var(--line);
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 5px 0 12px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin: 10px 0 4px;
      }
      input,
      select {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      .row > * {
        flex: 1;
      }
      .check {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .check input {
        width: auto;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 20px 0;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .canvas {
        position: relative;
        min-width: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at top, #233448, #111a26 70%);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        pointer-events: none;
        left: 18px;
        top: 16px;
        color: #94a9bf;
        font-size: 11px;
      }
      .notice {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 42px;
        font-size: 11px;
        color: #a8c2d4;
        pointer-events: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .legend {
        position: absolute;
        bottom: 17px;
        left: 18px;
        color: #91a5bb;
        font-size: 11px;
      }
      .layer {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .layer button {
        float: right;
        padding: 0 6px;
      }
      .layer b {
        font-size: 12px;
      }
      .error {
        color: #f2b090;
      }
      .ok {
        color: #8eceb2;
      }
      #status {
        padding: 12px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #frames {
        max-height: 220px;
        overflow: auto;
        font:
          11px/1.8 ui-monospace,
          monospace;
      }
      #image {
        max-width: 100%;
        max-height: 200px;
      }
      #filelist {
        max-height: 140px;
        overflow: auto;
      }
      .file {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
        padding: 4px;
      }
      .badge {
        font-size: 10px;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 3px 8px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 235px 1fr;
        }
        aside:last-child {
          display: none;
        }
      }
      @media (max-width: 560px) {
        main {
          grid-template-columns: 180px 1fr;
        }
        aside {
          padding: 9px;
        }
        header {
          gap: 8px;
          padding: 0 10px;
        }
        header small {
          display: none;
        }
        .row {
          flex-wrap: wrap;
        }
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .section-title h2 {
        margin: 0;
      }
      .help-dot {
        padding: 1px 7px;
        font-size: 11px;
        border-radius: 50%;
        color: var(--muted);
      }
      .welcome {
        position: absolute;
        z-index: 3;
        left: 24px;
        right: 24px;
        top: 90px;
        max-height: calc(100% - 150px);
        overflow: auto;
        border: 1px solid #415a72;
        background: rgba(23, 37, 53, 0.96);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 16px 50px #0003;
      }
      .welcome[hidden] {
        display: none;
      }
      .welcome h2 {
        text-transform: none;
        color: var(--text);
        font-size: 20px;
        letter-spacing: 0;
      }
      .welcome p {
        color: var(--muted);
        line-height: 1.8;
      }
      .welcome-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 18px;
      }
      .welcome-actions button:first-child {
        border-color: var(--accent);
      }
      #advice {
        padding: 12px;
        border: 1px solid #806547;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.7;
        font-size: 12px;
      }
      #advice p {
        margin: 0 0 8px;
      }
      #adviceHelp {
        font-size: 11px;
      }
      #guideDialog {
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        width: min(880px, calc(100% - 32px));
        max-height: 92vh;
        padding: 24px;
        overflow: auto;
      }
      #guideDialog::backdrop {
        background: #06101bc9;
        backdrop-filter: blur(5px);
      }
      .guide-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .guide-heading h1 {
        font-size: 20px;
        margin: 0;
      }
      .guide-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin: 18px 0;
      }
      .guide-nav button[aria-pressed="true"] {
        border-color: var(--accent);
        background: #2c455e;
      }
      .guide-settings {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 12px;
        margin: 16px 0;
      }
      .guide-settings[hidden] {
        display: none;
      }
      #guideBody h2 {
        font-size: 17px;
        color: var(--text);
        letter-spacing: 0;
        text-transform: none;
      }
      #guideBody p {
        line-height: 1.9;
        margin: 12px 0;
        color: #b6c7d9;
      }
      .command {
        margin: 16px 0;
        padding: 12px;
        background: #111c29;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .command textarea {
        width: 100%;
        min-height: 64px;
        background: transparent;
        color: #b9e0f5;
        resize: vertical;
        border: 0;
        font:
          12px/1.6 ui-monospace,
          monospace;
      }
      .command button {
        font-size: 11px;
      }
      .guide-footnote {
        font-size: 11px;
        color: var(--muted);
      }
      @media (max-width: 560px) {
        header .badge {
          display: none;
        }
        header {
          gap: 7px;
          padding: 0 10px;
        }
        header button {
          font-size: 11px;
          padding: 6px;
        }
        .welcome {
          left: 12px;
          right: 12px;
          padding: 16px;
        }
        .welcome h2 {
          font-size: 16px;
        }
        .guide-settings {
          grid-template-columns: 1fr;
        }
        #guideDialog {
          padding: 17px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>RViz Workbench</strong
      ><span class="badge">DEV PREVIEW · 0.1.1</span
      ><small data-i18n="subtitle">项目、坐标与实时话题</small
      ><button id="language" title="Language / 语言">EN</button
      ><button id="guideOpen" data-guide="start" data-i18n="guide">
        使用指南</button
      ><button id="home" data-i18n="reset">重置视角</button>
    </header>
    <main>
      <aside>
        <div class="section-title">
          <h2 data-i18n="connection">连接</h2>
          <button
            class="help-dot"
            data-guide="connect"
            aria-label="连接怎么用 / Help"
          >
            ?
          </button>
        </div>
        <label for="mode" data-i18n="mode">接入方式</label
        ><select id="mode">
          <option value="direct">ROS bridge</option>
          <option value="ssh">SSH → remote bridge</option></select
        ><label for="ros">ROS</label
        ><select id="ros">
          <option value="2">ROS 2</option>
          <option value="1">ROS 1</option></select
        ><label for="endpoint" id="endpointLabel">WebSocket URL</label
        ><input id="endpoint" value="ws://127.0.0.1:9090" spellcheck="false" />
        <div id="sshFields" hidden>
          <label for="alias">OpenSSH config alias</label
          ><input id="alias" placeholder="robot-lab" /><label for="port"
            >Remote loopback port</label
          ><input id="port" type="number" value="9090" min="1" max="65535" />
        </div>
        <label class="check"
          ><input id="qos" type="checkbox" /><span data-i18n="qos"
            >bridge 支持显式 QoS（2.1）</span
          ></label
        >
        <div class="row">
          <button id="connect" data-i18n="connect">连接</button
          ><button id="disconnect" data-i18n="disconnect" disabled>断开</button>
        </div>
        <p class="hint" data-i18n="networkHint">
          连接由 Aide 后端发起。SSH 使用后端已有密钥与 known_hosts，不接受密码。
        </p>
        <div id="advice" hidden>
          <p id="adviceText"></p>
          <button id="adviceHelp">查看处理步骤</button>
        </div>
        <hr />
        <div class="section-title">
          <h2 data-i18n="displays">显示</h2>
          <button
            class="help-dot"
            data-guide="topics"
            aria-label="显示怎么用 / Help"
          >
            ?
          </button>
        </div>
        <label for="fixed">Fixed frame</label
        ><input id="fixed" value="map" /><label for="topics" data-i18n="topic"
          >话题</label
        ><select id="topics">
          <option value="">—</option>
        </select>
        <div class="row">
          <button id="refresh" data-i18n="refresh" disabled>刷新话题</button
          ><button id="add" data-i18n="add" disabled>添加</button>
        </div>
        <div id="layers"></div>
        <div class="row">
          <button id="save" data-i18n="save" disabled>保存配置</button
          ><button id="demo" data-i18n="demo">演示场景</button>
        </div>
        <hr />
        <div class="section-title">
          <h2 data-i18n="project">项目资源</h2>
          <button
            class="help-dot"
            data-guide="models"
            aria-label="项目资源怎么用 / Help"
          >
            ?
          </button>
        </div>
        <select id="sources"></select
        ><label for="directory" data-i18n="directory">项目相对目录</label
        ><input id="directory" value="." />
        <div class="row">
          <button id="browse" data-i18n="browse">浏览</button
          ><button id="parent" data-i18n="parent">上一级</button>
        </div>
        <div id="filelist"></div>
        <label for="file">URDF / display config path</label
        ><input id="file" placeholder="urdf/robot.urdf" /><button
          id="load"
          class="file"
          data-i18n="load"
        >
          加载项目文件</button
        ><label for="packages" data-i18n="packages"
          >package 映射（JSON，相对项目根）</label
        ><input id="packages" value="{}" />
      </aside>
      <section class="canvas" id="viewport">
        <section class="welcome" id="welcome" aria-label="快速开始">
          <div id="welcomeBody"></div>
        </section>
        <div class="overlay">
          ROS · Z UP<br /><span id="sceneInfo">Grid / Axes</span>
        </div>
        <div class="notice" id="notice" role="status"></div>
        <div class="legend" data-i18n="controls">
          拖动旋转 · 滚轮缩放 · 右键平移
        </div>
      </section>
      <aside>
        <h2 data-i18n="diagnostics">诊断</h2>
        <div id="status" data-i18n="initial">未连接</div>
        <h2>TF</h2>
        <div id="frames">—</div>
        <hr />
        <h2 data-i18n="previewBudget">预览预算</h2>
        <p class="hint" data-i18n="budget">
          有界轮询，点云/激光最多 3,000 点、地图最多 16,384
          格/层。抽稀和坐标错误会明确标注。未连接真实机器人。
        </p>
        <img id="image" hidden alt="ROS image preview" />
      </aside>
    </main>
    <dialog id="guideDialog" aria-labelledby="guideTitle">
      <div class="guide-heading">
        <h1 id="guideTitle">使用指南</h1>
        <button id="guideClose">关闭指南</button>
      </div>
      <nav class="guide-nav" id="guideNav" aria-label="Guide sections"></nav>
      <div class="guide-settings" id="guideSettings" hidden>
        <div>
          <label for="guideRos" id="guideRosLabel">示例 ROS 版本</label
          ><select id="guideRos">
            <option value="2">ROS 2 Humble</option>
            <option value="1">ROS 1 Noetic</option>
          </select>
        </div>
        <div>
          <label for="guideWhere" id="guideWhereLabel"
            >Aide 实际运行在哪里？</label
          ><select id="guideWhere">
            <option value="desktop">Windows/macOS Docker Desktop</option>
            <option value="native">原生 Aide</option>
            <option value="network">与 ROS 共用 Docker 网络</option>
          </select>
        </div>
      </div>
      <div id="guideBody"></div>
    </dialog>

ch \u63A5\u53E3\u7684 RC12 \u6216\u66F4\u65B0\u5BBF\u4E3B\uFF1B\u4E0D\u80FD\u76F4\u63A5\u53CC\u51FB viewer.html\u3002","Open this through Aide's plugin workbench on an RC12-or-newer compatible host. Do not open viewer.html directly.")}:/URDF|package map|mesh|project path|ENOENT/i.test(t)?{section:"models",text:cn(e,"\u5148\u9009\u62E9\u6B63\u786E\u7684\u9879\u76EE\u6765\u6E90\uFF0C\u518D\u586B\u5199\u76F8\u5BF9\u8DEF\u5F84\u3002package \u6620\u5C04\u6307\u5411\u9879\u76EE\u5185\u5305\u6839\u76EE\u5F55\uFF1B\u76EE\u524D\u652F\u6301 URDF\u3001STL/OBJ\uFF0C\u4E0D\u76F4\u63A5\u6267\u884C Xacro\u3002","Choose the project source and a relative path. Package mappings point to package roots inside that project. This preview supports URDF with STL/OBJ and does not execute Xacro.")}:{section:"connect",text:cn(e,"\u6253\u5F00\u4F7F\u7528\u6307\u5357\uFF0C\u6309\u201C\u51C6\u5907 ROS \u2192 \u8FDE\u63A5 \u2192 \u6DFB\u52A0\u8BDD\u9898\u201D\u9010\u6B65\u68C0\u67E5\u3002","Open the guide and check Prepare ROS \u2192 Connect \u2192 Add a topic.")}}function El(i,e,t){let n=(r,a)=>cn(e,r,a),s={start:[n("\u5148\u9009\u4E00\u79CD\u4F53\u9A8C\u65B9\u5F0F","Choose how to start"),n("\u6CA1\u6709 ROS \u6216\u673A\u5668\u4EBA\uFF1A\u5148\u70B9\u201C\u79BB\u7EBF\u6F14\u793A\u201D\uFF0C\u53EA\u770B\u51E0\u4F55\u793A\u4F8B\uFF0C\u4E0D\u4F1A\u8FDE\u63A5\u7F51\u7EDC\u3002","No ROS or robot: use Offline demo for synthetic geometry without a network connection."),n("\u60F3\u770B\u771F\u5B9E ROS \u6570\u636E\uFF1A\u4F7F\u7528\u968F ZIP \u9644\u5E26\u7684 Docker \u793A\u4F8B\uFF0C\u542F\u52A8 ROS + rosbridge + \u5408\u6210\u53D1\u5E03\u8282\u70B9\u3002","For real ROS messages, start the Docker example included in the ZIP: ROS + rosbridge + a synthetic publisher."),n("\u5DF2\u6709\u673A\u5668\u4EBA\uFF1A\u5148\u5728 ROS \u7535\u8111\u542F\u52A8 rosbridge/rosapi\uFF0C\u518D\u9009\u62E9\u5C40\u57DF\u7F51\u5730\u5740\u6216\u5DF2\u914D\u7F6E\u7684\u540E\u7AEF SSH alias\u3002","For your robot, start rosbridge/rosapi on its ROS computer, then use a reachable LAN address or configured backend SSH alias."),n("\u8FDE\u63A5\u53EA\u662F\u5EFA\u7ACB\u901A\u9053\u3002\u9009\u62E9\u8BDD\u9898\u5E76\u70B9\u201C\u6DFB\u52A0\u201D\u540E\uFF0C\u753B\u5E03\u624D\u4F1A\u663E\u793A\u6570\u636E\uFF1B\u52A0\u8F7D URDF \u662F\u53EF\u9009\u7684\u4E0B\u4E00\u6B65\u3002","Connecting only opens the channel. Select a topic and click Add to display it. Loading a URDF is an optional next step.")],docker:[n("\u7528 Docker \u8DD1\u901A\u7B2C\u4E00\u5E45\u771F\u5B9E ROS \u753B\u9762","Your first real ROS view with Docker"),n("\u5148\u89E3\u538B\u672C\u5730\u5F15\u5BFC\u7248\u63D2\u4EF6 ZIP\uFF0C\u5728\u542B examples/docker \u7684\u76EE\u5F55\u6253\u5F00\u7EC8\u7AEF\u3002\u53EA\u9700 Docker\uFF0C\u4E0D\u9700\u8981\u672C\u673A\u5B89\u88C5 ROS\u3001Go \u6216 npm\u3002","Extract the guided-preview plugin ZIP and open a terminal in the folder containing examples/docker. Only Docker is needed; no host ROS, Go or npm installation."),n("\u9996\u6B21\u6784\u5EFA\u4F1A\u8054\u7F51\u4E0B\u8F7D\u5B98\u65B9 ROS \u955C\u50CF\u548C rosbridge \u4F9D\u8D56\u3002\u670D\u52A1\u53EA\u6620\u5C04\u672C\u673A\u56DE\u73AF\u7AEF\u53E3\uFF0C\u4E0D\u8FDE\u63A5\u771F\u5B9E\u673A\u5668\u4EBA\uFF0C\u4E5F\u4E0D\u4FEE\u6539\u73B0\u6709 Aide\u3002","The first build downloads official ROS images and rosbridge packages. Demo ports bind to host loopback only; no real robot or existing Aide service is modified."),n("\u5728\u4E0B\u9762\u9009\u62E9 Aide \u5B9E\u9645\u8FD0\u884C\u7684\u4F4D\u7F6E\uFF0C\u590D\u5236\u542F\u52A8\u547D\u4EE4\u3002\u65E5\u5FD7\u5C31\u7EEA\u540E\u70B9\u201C\u586B\u5165\u53C2\u6570\u201D\uFF0C\u5173\u95ED\u6307\u5357\uFF0C\u518D\u70B9\u201C\u8FDE\u63A5\u201D\u3002","Select where Aide actually runs, copy the command, and wait for the bridge-ready log. Apply parameters, close the guide, then click Connect."),n(`\u6210\u529F\u540E\u9009\u62E9 ${t.topic}\uFF0C\u70B9\u51FB\u201C\u6DFB\u52A0\u201D\u3002Fixed frame \u7528 map\uFF1B\u5E94\u51FA\u73B0\u4E00\u5708\u6FC0\u5149\u70B9\u3002`,`Then select ${t.topic} and click Add. Use map as Fixed frame; a ring of laser points should appear.`)],connect:[n("\u5730\u5740\u8BE5\u600E\u4E48\u586B\uFF1F","Which address should I use?"),n("\u8FD9\u91CC\u586B\u7684\u662F Aide \u540E\u7AEF\u80FD\u8BBF\u95EE\u7684 ROS bridge \u5730\u5740\uFF0C\u4E0D\u662F\u6D4F\u89C8\u5668\u5F53\u524D\u9875\u9762\u5730\u5740\uFF0C\u4E5F\u4E0D\u662F ROS master \u5730\u5740\u3002","Use a ROS bridge address reachable from the Aide backend, not the browser page URL or ROS master URL."),n("Windows/macOS Docker Desktop\uFF0C\u540C\u673A Docker \u793A\u4F8B\uFF1A\u901A\u5E38\u7528 ws://host.docker.internal:18501\u3002","Windows/macOS Docker Desktop with the local demo: usually ws://host.docker.internal:18501."),n("Aide \u539F\u751F\u8DD1\u5728\u672C\u673A\uFF1A\u540C\u673A\u793A\u4F8B\u7528 ws://127.0.0.1:18501\u3002Aide \u548C ROS \u5728\u540C\u4E00 Docker \u7F51\u7EDC\uFF1A\u7528\u670D\u52A1\u540D ros2-demo:9090\u3002Linux Docker \u4F18\u5148\u91C7\u7528\u540C\u4E00 Docker \u7F51\u7EDC\u3002","Native Aide on the host: ws://127.0.0.1:18501. Same Docker network: ros2-demo:9090. Prefer a shared Docker network on Linux."),n("\u771F\u5B9E\u673A\u5668\u4EBA\uFF1A\u7528\u5B83\u7684\u53EF\u8FBE IP \u4E0E bridge \u7AEF\u53E3\uFF0C\u4F8B\u5982 ws://\u673A\u5668\u4EBAIP:9090\u3002\u4E0D\u8981\u76F4\u63A5\u628A\u793A\u4F8B\u5730\u5740\u5F53\u4F5C\u673A\u5668\u4EBA\u5730\u5740\u3002\u8DE8\u4E0D\u53EF\u4FE1\u7F51\u7EDC\u5E94\u4F7F\u7528 WSS \u6216 SSH\u3002","For a robot, use its reachable IP and bridge port, e.g. ws://ROBOT_IP:9090. Demo addresses are not robot addresses. Use WSS or SSH over untrusted networks."),n("\u8FDE\u63A5\u6210\u529F\u540E\u8FD8\u8981\u6DFB\u52A0\u8BDD\u9898\u3002\u5982\u679C\u5217\u8868\u4E3A\u7A7A\uFF0C\u68C0\u67E5 rosapi \u548C\u53D1\u5E03\u8282\u70B9\uFF0C\u518D\u70B9\u51FB\u201C\u5237\u65B0\u8BDD\u9898\u201D\u3002\u65E7 bridge \u7684\u663E\u5F0F QoS \u5148\u4FDD\u6301\u5173\u95ED\u3002","After connecting, add a topic. If the list is empty, check rosapi and publishers, then Refresh. Leave explicit QoS off on older bridges.")],topics:[n("\u4E3A\u4EC0\u4E48\u8FDE\u4E0A\u4E86\u8FD8\u662F\u7A7A\u767D\uFF1F","Connected, but the view is empty?"),n("1. \u9009\u62E9\u6709\u53D1\u5E03\u8005\u7684\u8BDD\u9898\u5E76\u70B9\u51FB\u201C\u6DFB\u52A0\u201D\uFF1B\u5217\u8868\u53EA\u663E\u793A\u672C\u9884\u89C8\u652F\u6301\u7684\u6D88\u606F\u7C7B\u578B\u3002\u793A\u4F8B\u5148\u9009 /rviz_acceptance/scan\u3002","1. Select a published topic and click Add. The list contains only supported message types. Start with /rviz_acceptance/scan in the demo."),n("2. Fixed frame \u662F\u6240\u6709\u6570\u636E\u6C47\u603B\u5230\u7684\u5750\u6807\u7CFB\u3002\u793A\u4F8B\u586B map\uFF1B\u81EA\u5DF1\u7684\u6570\u636E\u53EF\u5148\u586B\u6D88\u606F header.frame_id\uFF0C\u4E4B\u540E\u518D\u68C0\u67E5 TF \u94FE\u3002","2. Fixed frame is the common coordinate system. Use map for the demo. For your data, try its header.frame_id first, then check the TF chain."),n("3. \u70B9\u4E91\u65E0\u6548\u503C\u3001\u5750\u6807\u7F3A\u5931\u3001\u6D88\u606F\u8FC7\u671F\u548C\u8D85\u51FA\u9884\u7B97\u4F1A\u663E\u793A\u9519\u8BEF\uFF1B\u4E0D\u8981\u53EA\u770B\u201C\u5DF2\u8FDE\u63A5\u201D\u72B6\u6001\u3002","3. Invalid clouds, missing transforms, stale messages and budget limits have separate errors. Connected does not mean a display is receiving valid data."),n("4. \u65CB\u8F6C\uFF1A\u5DE6\u952E\u62D6\u52A8\uFF1B\u7F29\u653E\uFF1A\u6EDA\u8F6E\uFF1B\u5E73\u79FB\uFF1A\u53F3\u952E\u62D6\u52A8\uFF1B\u89C6\u89D2\u4E71\u4E86\u70B9\u201C\u91CD\u7F6E\u89C6\u89D2\u201D\u3002\u5220\u9664\u56FE\u5C42\u7528 \xD7\u3002","4. Left-drag to orbit, wheel to zoom, right-drag to pan. Reset camera restores the view; \xD7 removes a layer.")],models:[n("URDF \u548C package \u6620\u5C04\u600E\u4E48\u7528\uFF1F","How do URDF and package mappings work?"),n("1. \u9879\u76EE\u6765\u6E90\u7531 Aide \u6388\u6743\uFF1B\u672C\u673A\u8DEF\u5F84\u548C SSH \u9879\u76EE\u8DEF\u5F84\u662F\u4E0D\u540C\u6765\u6E90\u3002\u5148\u9009\u5BF9\u6765\u6E90\u5E76\u70B9\u201C\u6D4F\u89C8\u201D\u3002","1. Aide authorizes project sources. Host paths and SSH project paths are different sources. Choose one and Browse."),n("2. \u628A\u793A\u4F8B robot.urdf \u590D\u5236\u5230\u4F60\u7684\u9879\u76EE\u6839\u76EE\u5F55\u540E\uFF0C\u586B robot.urdf\uFF1B\u82E5\u9879\u76EE\u672C\u8EAB\u5C31\u662F\u672C\u63D2\u4EF6\u6E90\u7801\u76EE\u5F55\uFF0C\u586B examples/project/robot.urdf\u3002\u8DEF\u5F84\u76F8\u5BF9\u6240\u9009\u9879\u76EE\u6839\u76EE\u5F55\uFF0C\u4E0D\u662F\u672C\u673A\u7EDD\u5BF9\u8DEF\u5F84\u3002","2. Copy the sample robot.urdf into your project root and enter robot.urdf. If the plugin source folder is your project, use examples/project/robot.urdf. Paths are relative to the selected project root."),n('3. \u5982\u679C URDF \u5199 package://my_robot/meshes/body.stl\uFF0C\u4E14\u5305\u4F4D\u4E8E src/my_robot\uFF0C\u586B {"my_robot":"src/my_robot"}\u3002\u4E0D\u4F7F\u7528 package:// \u65F6\u4FDD\u6301 {}\u3002','3. For package://my_robot/meshes/body.stl with a package at src/my_robot, enter {"my_robot":"src/my_robot"}. Keep {} if no package:// paths are used.'),n("4. \u652F\u6301\u57FA\u7840\u51E0\u4F55\u3001STL/OBJ\uFF1BXacro\u3001DAE\u3001\u7EB9\u7406\u548C\u5B8C\u6574 .rviz \u5BFC\u5165\u5C1A\u672A\u652F\u6301\u3002\u5B9E\u65F6\u5173\u8282\u59FF\u6001\u9700\u8981\u4E0E link \u540D\u79F0\u4E00\u81F4\u7684 TF\u3002","4. Supports primitives and STL/OBJ. Xacro, DAE, textures and complete .rviz import are not supported. Live link poses require matching TF frame names."),n("\u201C\u4FDD\u5B58\u914D\u7F6E\u201D\u4F1A\u751F\u6210\u5F85\u5BA1\u6279\u7684\u6587\u4EF6\u63D0\u6848\uFF0C\u4E0D\u4F1A\u76F4\u63A5\u8986\u76D6\u9879\u76EE\u3002\u91CD\u65B0\u8F7D\u5165\u4FDD\u5B58\u7684 session.json \u540E\uFF0C\u4ECD\u9700\u660E\u786E\u5EFA\u7ACB\u8FDE\u63A5\u3002","Save config creates a file proposal requiring approval. It does not silently overwrite the project. Loading session.json still requires an explicit connection.")],ssh:[n("SSH \u8981\u5728\u54EA\u914D\u7F6E\uFF1F","Where do I configure SSH?"),n("SSH \u662F Aide \u540E\u7AEF\u53D1\u8D77\u7684\u3002Aide \u5728 Docker \u5185\u65F6\uFF0C\u540E\u7AEF\u5FC5\u987B\u80FD\u770B\u5230 SSH config\u3001\u5BC6\u94A5\u548C known_hosts\uFF1BWindows/macOS \u684C\u9762\u7684\u914D\u7F6E\u4E0D\u4F1A\u81EA\u52A8\u7EE7\u627F\u3002","SSH starts in the Aide backend. In Docker, that backend must have the config, keys and known_hosts; desktop configuration is not inherited."),n("\u5148\u5728\u540C\u4E00\u540E\u7AEF\u9A8C\u8BC1 ssh robot-lab \u80FD\u5BC6\u94A5\u767B\u5F55\u3002\u63D2\u4EF6\u586B alias robot-lab \u548C\u8FDC\u7AEF\u56DE\u73AF bridge \u7AEF\u53E3\uFF0C\u901A\u5E38\u662F 9090\u3002","Verify ssh robot-lab with key authentication in that backend. Enter robot-lab as the alias and the remote loopback bridge port, usually 9090."),n("\u4F7F\u7528\u81EA\u5B9A\u4E49 config \u65F6\uFF0C\u5728 Aide \u63D2\u4EF6\u8BBE\u7F6E\u4E2D\u586B\u5199 sshConfigFile\uFF0C\u6307\u5411\u540E\u7AEF\u53EF\u8BFB\u7684\u914D\u7F6E\u6587\u4EF6\u3002\u4E0D\u8981\u628A\u5BC6\u7801\u6216\u79C1\u94A5\u7C98\u5230\u804A\u5929\u3001\u8FDE\u63A5\u5730\u5740\u6216\u9879\u76EE\u914D\u7F6E\u4E2D\u3002","For a custom config, set sshConfigFile in the Aide plugin settings to a backend-readable path. Do not paste passwords or private keys into chat, URLs or project settings."),n("\u8FDC\u7AEF rosbridge \u53EF\u53EA\u76D1\u542C 127.0.0.1\uFF1B\u63D2\u4EF6\u5EFA\u7ACB\u52A0\u5BC6\u8F6C\u53D1\u3002\u4E3B\u673A\u5BC6\u94A5\u4E0D\u5339\u914D\u65F6\u5148\u6838\u5B9E\u670D\u52A1\u5668\uFF0C\u4E0D\u5E94\u5173\u95ED\u6821\u9A8C\u3002","The remote bridge may bind only to 127.0.0.1; the plugin opens an encrypted tunnel. Verify host-key changes instead of disabling verification.")]};return s[i]||s.start}function Ag({document:i,language:e,onDemo:t,onAppl
