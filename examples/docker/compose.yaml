name: aide-rviz-demo
services:
  ros2-demo:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile.ros2
    image: aide-rviz-demo:humble-local
    ports:
      - "127.0.0.1:18501:9090"
    networks: [demo]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    init: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
  ros1-demo:
    profiles: [ros1]
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile.ros1
    image: aide-rviz-demo:noetic-local
    ports:
      - "127.0.0.1:18502:18502"
    networks: [demo]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    init: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  demo:
    name: aide-rviz-demo
